# This workflow is provided via the organization template repository
#
# https://github.com/nextcloud/.github
# https://docs.github.com/en/actions/learn-github-actions/sharing-workflows-with-your-organization

name: Nextcloud static analysis

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: psalm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: [self-hosted, Linux, X64, nebulas-spot]
    timeout-minutes: 30
    strategy:
      # do not stop on another job's failure
      fail-fast: false
      matrix:
        ocp-version: [ 'dev-master', 'dev-stable26', 'dev-stable25', 'dev-stable24' ]

    name: Nextcloud ${{ matrix.ocp-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up php
        uses: shivammathur/setup-php@1a18b2267f80291a81ca1d33e7c851fe09e7dfc4 # v2
        with:
          php-version: 8.3
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer i

      - name: Resolve the complete compatibility dependency graph
        run: |
          composer require --dev nextcloud/ocp:${{ matrix.ocp-version }} --no-update
          composer update --no-audit --with-all-dependencies --ignore-platform-reqs

      - name: Run coding standards check
        run: composer run psalm

  summary:
    runs-on: [self-hosted, Linux, X64, nebulas-spot]
    timeout-minutes: 30
    needs: static-analysis

    if: always()

    name: static-psalm-analysis-summary

    steps:
      - name: Summary status
        run: if ${{ needs.static-analysis.result != 'success' }}; then exit 1; fi
